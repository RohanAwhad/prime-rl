[project]
name = "ifbench-api-adapter"
description = "IFBench instruction-following verification environment"
tags = ["ifbench", "train", "eval"]
version = "0.1.2"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.12.dev6",
    "api-adapter @ file:///home/lab/rawhad/api-adapter",
    "loguru",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["ifbench_api_adapter.py", "pyproject.toml", "data/"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 1
